# profiles/index.yaml
#
# Rules:
# - first model listed is the primary / anchor model
# - primary model gets the larger GPU share in dual-model profiles
# - secondary model is the companion model
# - "mini-*" means MiniCPM-V 4.5 is the anchor, not a small model
# - "qwen3.5" on this box means Qwen 3.5 35B single anchor
#
# status:
#   known_good | experimental | broken | unknown
#
# fits_box:
#   whether this profile is known to fit and run on this L40S-90 48GB box
#
# gateway_model_id:
#   the exact LiteLLM model id exposed at /v1/models and used for real routing.
#   if this does not match the live LiteLLM config, the model is not callable in practice.
# gpu_split_hint:
#   operational hint only; not an enforced scheduler value
profiles:

  - name: qwen3.5
    path: ./qwen3.5
    status: known_good
    known_good: true
    fits_box: true
    purpose: general_agentic_anchor
    primary_model: qwen-3.5-35b
    secondary_model: null
    anchor_model: qwen-3.5-35b
    gpu_split_hint: "single-model anchor"
    notes: "Single anchor model for general agentic tasks."

  - name: minicpm-v
    path: ./minicpm-v
    status: known_good
