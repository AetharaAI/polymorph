networks:
  aether-ops:
    external: true

services:
  # PRIMARY: Cyber reasoning brain
  cisco-sec:
    image: vllm/vllm-openai:nightly
    container_name: cisco-sec
    runtime: nvidia
    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/blue-red:/logs
    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer EMPTY' http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    command: >
      /models/llm/fdtn-ai/Foundation-Sec-8B-Reasoning
      --served-model-name cisco-sec
      --host 0.0.0.0
      --port 8000
      --dtype bfloat16
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.55
      --max-model-len 16384
      --max-num-seqs 2
      --max-num-batched-tokens 8192
      --reasoning-parser minimax_m2
      --enable-auto-tool-choice
      --tool-call-parser llama3_json
      --enable-prefix-caching
      --enable-chunked-prefill
      --trust-remote-code
      --api-key EMPTY
    restart: unless-stopped

  vulnllm-r-7b:
    image: vllm/vllm-openai:nightly
    container_name: vulnllm-r-7b
    runtime: nvidia
    networks:
      - aether-ops
    depends_on:
      cisco-sec:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/vulnllm-r-7b:/logs
    ports:
      - "8102:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer EMPTY' http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    command: >
      /models/llm/cyankiwi/VulnLLM-R-7B-AWQ-8bit
      --served-model-name vulnllm-r-7b
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --quantization awq_marlin
      --gpu-memory-utilization 0.25
      --max-model-len 8192
      --max-num-seqs 4
      --max-num-batched-tokens 8192
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --enable-chunked-prefill
      --generation-config vllm
      --trust-remote-code
      --api-key EMPTY
    restart: unless-stopped
