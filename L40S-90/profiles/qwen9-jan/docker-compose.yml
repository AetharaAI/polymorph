# ============================================
# FLEET PROFILE A: Voice Agent Lightweights
# Qwen3.5-9B + Qwen3.5-4B on L40S-90 (48GB)
# Total util: 48% + 30% = 78%
# ============================================

networks:
  aether-ops:
    external: true

services:
  qwen3.5-9b:
    image: vllm/vllm-openai:nightly
    container_name: qwen3.5-9b
    runtime: nvidia
    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - path: .env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/qwen3.5-9b:/logs
    ports:
      - "8101:8000"
    command: >
      /models/cyankiwi/Qwen3.5-9B-AWQ-BF16-INT8
      --served-model-name qwen3.5-9b
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.53
      --max-model-len 16384
      --max-num-seqs 8
      --max-num-batched-tokens 4096
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enforce-eager
      --enable-prefix-caching
      --enable-chunked-prefill
      --generation-config vllm
      --api-key EMPTY
    restart: unless-stopped

  nanbeige4-3b-thinking:
    image: vllm/vllm-openai:latest
    container_name: nanbeige4-3b-thinking
    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    runtime: nvidia

    environment:
      - HF_HOME=/cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache

    ports:
      - "8102:8000"

    command: >
      --model /models/llm/Nanbeige/Nanbeige4-3B-Thinking-2511
      --served-model-name nanbeige4-3b-thinking
      --dtype auto
      --gpu-memory-utilization 0.20
      --max-model-len 8192
      --port 8000
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --enforce-eager
      --generation-config vllm

    restart: unless-stopped
