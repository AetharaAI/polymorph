networks:
  aether-ops:
    external: true
services:
  omnicoder:
    image: vllm/vllm-openai:nightly
    container_name: omnicoder
    runtime: nvidia

    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - path: .env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/omnicoder:/logs
    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer EMPTY' http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    command: >
      /models/llm/cyankiwi/OmniCoder-9B-AWQ-4bit
      --served-model-name omnicoder
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --dtype auto
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.53
      --max-model-len 16384
      --max-num-seqs 8
      --max-num-batched-tokens 6144
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --tool-call-parser qwen3_coder
      --enforce-eager
      --enable-prefix-caching
      --enable-chunked-prefill
      --generation-config vllm
      --api-key EMPTY
    restart: unless-stopped

  qwen3.5-9b:
    image: vllm/vllm-openai:nightly
    container_name: qwen3.5-9b
    runtime: nvidia
    networks:
      - aether-ops
    depends_on:
      omnicoder:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - path: .env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro_old/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/qwen3.5-9b:/logs
    ports:
      - "8102:8000"
    command: >
      /models/cyankiwi/Qwen3.5-9B-AWQ-4bit
      --served-model-name qwen3.5-9b
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.33
      --max-model-len 16384
      --max-num-seqs 4
      --max-num-batched-tokens 4096
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enforce-eager
      --tokenizer-mode auto
      --trust-remote-code
      --enable-prefix-caching
      --enable-chunked-prefill
      --generation-config vllm
      --api-key EMPTY
    restart: unless-stopped