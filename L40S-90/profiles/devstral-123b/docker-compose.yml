
networks:
  aether-ops:
    external: true
services:
  devstral-122b:
    image: vllm/vllm-openai:latest
    container_name: devstral-122b
    restart: unless-stopped

    networks:
      - aether-ops
    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - /logs/devstral122b:/logs

    ports:
      - "8101:8000"

    command: >
      --model /models/llm/cyankiwi/Devstral-2-123B-Instruct-2512-AWQ-4bit
      --served-model-name devstral-122b
      --host 0.0.0.0
      --port 8000
      --tokenizer_mode mistral
      --config_format mistral
      --load_format mistral
      --trust-remote-code
      --dtype auto
      --gpu-memory-utilization 0.82
      --max-model-len 65768
      --max-num-seqs 8
      --max-num-batched-tokens 4096
      --enable-auto-tool-choice
      --tool-call-parser mistral
      --enforce-eager
      --enable-prefix-caching
      --enable-chunked-prefill
      --generation-config vllm
      --api-key EMPTY