networks:
  aether-ops:
    external: true
services:
  qwen3.5-2b:
    image: vllm/vllm-openai:nightly
    container_name: qwen3.5-2b
    runtime: nvidia
    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/qwen3.5-2b:/logs
    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer EMPTY' http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    command: >
      /models/cyankiwi/Qwen3.5-2B-AWQ-4bit
      --trust-remote-code
      --served-model-name qwen3.5-2b
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.16
      --max-model-len 4096
      --max-num-seqs 1
      --max-num-batched-tokens 4096
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enforce-eager
      --enable-prefix-caching
      --enable-chunked-prefill
      --generation-config vllm
      --api-key EMPTY
    restart: unless-stopped


  # VISION: Multimodal red intel (the one you had working)
  redqwen-vl:
    image: vllm/vllm-openai:nightly
    container_name: redqwen-vl
    runtime: nvidia
    networks:
      - aether-ops
    depends_on:
      qwen3.5-2b:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/redqwen-vl:/logs
    ports:
      - "8102:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer EMPTY' http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    command: >
      /models/llm/prithivMLmods/Qwen3-VL-8B-Instruct-Unredacted-MAX
      --served-model-name redqwen-vl
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --gpu-memory-utilization 0.65
      --max-model-len 16384
      --max-num-seqs 4
      --max-num-batched-tokens 8192
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --enable-chunked-prefill
      --limit-mm-per-prompt '{"image": 3}'
      --chat-template-content-format openai
      --trust-remote-code
      --api-key EMPTY
    restart: unless-stopped