networks:
  aether-ops:
    external: true
services:
  minicpm-v:
    image: vllm/vllm-openai:nightly
    container_name: minicpm-v
    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    runtime: nvidia

    environment:
      - HF_HOME=/cache
      - VLLM_VIDEO_LOADER_BACKEND=enhanced_opencv
    volumes:
      - /mnt/aetherpro_old/models:/models
      - /mnt/aetherpro_old/cache:/cache

    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer EMPTY' http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    command: >
      /models/vision/openbmb/MiniCPM-V-4_5-AWQ
      --served-model-name minicpm-v
      --dtype auto
      --gpu-memory-utilization 0.65
      --max-model-len 8192
      --max-num-seqs 2
      --max-num-batched-tokens 8192
      --trust-remote-code
      --port 8000
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --enforce-eager
      --limit-mm-per-prompt '{"image":1, "video": 1}'
      --api-key EMPTY
      --generation-config vllm

  omnicoder:
    image: vllm/vllm-openai:nightly
    container_name: omnicoder
    runtime: nvidia
    depends_on:
      minicpm-v:
        condition: service_healthy
    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - path: .env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/omnicoder:/logs
    ports:
      - "8102:8000"
    command: >
      /models/llm/cyankiwi/OmniCoder-9B-AWQ-4bit
      --served-model-name omnicoder
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --dtype auto
      --kv-cache-dtype fp8
      --gpu-memory-utilization 0.33
      --max-model-len 16384
      --max-num-seqs 8
      --max-num-batched-tokens 4096
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --enforce-eager
      --enable-prefix-caching
      --enable-chunked-prefill
      --generation-config vllm
      --default-chat-template-kwargs '{"enable_thinking": false}'
      --api-key EMPTY
    restart: unless-stopped
