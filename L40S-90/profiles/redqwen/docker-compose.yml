networks:
  aether-ops:
    external: true
services:
 # VISION: Multimodal red intel (the one you had working)
  redqwen-vl:
    image: vllm/vllm-openai:nightly
    container_name: redqwen-vl
    runtime: nvidia
    networks:
      - aether-ops

    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      HF_HOME: /cache
      HF_HUB_CACHE: /cache/.hf-cache
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache
      - ./logs/redqwen-vl:/logs
    ports:
      - "8102:8000"

    command: >
      /models/llm/prithivMLmods/Qwen3-VL-8B-Instruct-Unredacted-MAX
      --served-model-name redqwen-vl
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --gpu-memory-utilization 0.65
      --max-model-len 16384
      --max-num-seqs 4
      --max-num-batched-tokens 8192
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --enable-chunked-prefill
      --limit-mm-per-prompt '{"image": 3}'
      --chat-template-content-format openai
      --trust-remote-code
      --api-key EMPTY
    restart: unless-stopped


