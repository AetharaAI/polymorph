networks:
  aether-ops:
    external: true
services:
  minicpm-o:
    image: vllm/vllm-openai:nightly
    container_name: minicpm-o
    networks:
      - aether-ops
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - .env
    runtime: nvidia

    environment:
      - HF_HOME=/cache
      - VLLM_VIDEO_LOADER_BACKEND=enhanced_opencv
    volumes:
      - /mnt/aetherpro/models:/models
      - /mnt/aetherpro/cache:/cache

    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer EMPTY' http://localhost:8000/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    command: >
      /models/vision/openbmb/MiniCPM-o-4_5
      --served-model-name minicpm-o
      --dtype auto
      --gpu-memory-utilization 0.65
      --max-model-len 8192
      --max-num-seqs 2
      --max-num-batched-tokens 4096
      --trust-remote-code
      --port 8000
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --enforce-eager
      --limit-mm-per-prompt '{"image":1, "video": 1}'
      --api-key EMPTY
      --generation-config vllm